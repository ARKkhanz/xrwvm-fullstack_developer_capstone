<html>
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="static/style.css">
  <link rel="stylesheet" href="static/bootstrap.min.css">
<script>
async function logout(event) {
  if (event) event.preventDefault();
  try {
    const response = await fetch("/djangoapp/logout", {
      method: "GET", credentials: "same-origin"
    });
    const json = await response.json();
    if (!response.ok || json.userName !== "") {
      throw new Error("The user could not be logged out.");
    }
    const username = sessionStorage.getItem("username") || "user";
    sessionStorage.removeItem("username");
    alert("Logging out " + username + "...");
    window.location.href = "/";
  } catch (error) {
    alert(error.message);
  }
}

async function checkSession() {
  const container = document.getElementById("loginlogout");
  try {
    const response = await fetch("/djangoapp/session", {
      credentials: "same-origin"
    });
    if (!response.ok) throw new Error("Session check failed.");
    const json = await response.json();
    container.replaceChildren();

    if (json.userName) {
      sessionStorage.setItem("username", json.userName);
      const name = document.createElement("span");
      name.className = "homepage_links";
      name.textContent = json.userName;
      const link = document.createElement("a");
      link.className = "homepage_links";
      link.href = "/";
      link.textContent = "Logout";
      link.addEventListener("click", logout);
      container.append(name, link);
    } else {
      sessionStorage.removeItem("username");
      for (const [label, href] of [
        ["Login", "/login/"], ["Register", "/register/"]
      ]) {
        const link = document.createElement("a");
        link.className = "homepage_links";
        link.href = href;
        link.textContent = label;
        container.appendChild(link);
      }
    }
  } catch (error) {
    container.textContent = "Unable to check login. Refresh to retry.";
  }
}
</script>
</head>
<body onload="checkSession()">
<nav class="navbar navbar-expand-lg navbar-light" style="background-color:darkturquoise; height: 1in;">
  <div class="container-fluid">
    <h2 style="padding-right: 5%;">Dealerships</h2>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarText">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" style="font-size: larger;" aria-current="page" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" style="font-size: larger;" href="/about">About Us</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" style="font-size: larger;" href="/contact">Contact Us</a>
        </li>
      </ul>
      <span class="navbar-text">
        <div class="loginlink" id="loginlogout">
        </div>
        </span>
    </div>
  </div>
</nav>
<div style="display: flex;flex-direction: column;">
<div class="card" style="width: 50%;margin-top: 50px;align-self: center;">
  <img src="static/car_dealership.jpg" class="card-img-top" alt="...">
  <div class="banner">
    <h5>Welcome to our Dealerships!</h5>
    <a href="/dealers" class="btn" style="background-color: aqua;margin:10px">View Dealerships</a>
  </div>
</div>
</div>
</body>
</html>
